
<!DOCTYPE html>
<html>
<head>
    <title>Flask User Input</title>
</head>
<body>

    <h1>User Input Form</h1>

    <form method="POST">
        <label>Enter your name:</label>
        <input type="text" name="username" required>

        <button type="submit">Submit</button>
    </form>

    {% if name %}
        <h2>Hello, {{ name }}!</h2>
    {% endif %}

</body>
</html>
